[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]

# Pinned toolchain. The protected suite is `pragma solidity 0.8.26`, so nothing floats.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
# Keep CREATE2 addresses reproducible across machines: no metadata hash in the bytecode.
bytecode_hash = "none"

# The verifier runs offline with no shell or filesystem reach. Nothing here needs either.
ffi = false
fs_permissions = []

# Vendored as ordinary files under lib/ (see lib/VENDOR.md). No submodules, no network.
remappings = [
    "forge-std/=lib/forge-std/src/",
    "v4-core/=lib/v4-core/",
    "solmate/=lib/solmate/",
]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
